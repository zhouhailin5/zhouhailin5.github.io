# ============================================
# Butterfly 主题配置（v1.0 精简版）
# 说明：未在此文件配置的项使用主题内置默认值
# 文档：https://butterfly.js.org/
# ============================================

# 导航菜单
menu:
  首页: / || fas fa-home
  日记: /categories/日记/ || fas fa-book-open
  笔记: /categories/笔记/ || fas fa-sticky-note
  随笔: /categories/随笔/ || fas fa-pen-fancy
  图集: /categories/图集/ || fas fa-images
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags

# 全站背景图
background: /img/bg.jpg

# 侧栏
aside:
  card_author:
    enable: false
  card_announcement:
    enable: true
    content: 欢迎王同学莅临指导

# 自定义样式注入
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">

# 社交链接（后续可在此追加）
social:

# 头像
avatar:
  img: /img/avatar.png

# 页脚
footer:
  owner:
    enable: true
    since: 2026
    custom_text: 其实我在想

# 文章页显示更新时间
post_meta:
  updated:
    display: true
