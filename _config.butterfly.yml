# ============================================
# Butterfly 主题配置（v1.0 精简版）
# 说明：未在此文件配置的项使用主题内置默认值
# 文档：https://butterfly.js.org/
# ============================================

# 导航菜单
menu:
  首页: / || fas fa-home
  日记: /categories/日记/ || fas fa-book-open
  笔记: /categories/笔记/ || fas fa-sticky-note
  随笔: /categories/随笔/ || fas fa-pen-fancy
  图集: /categories/图集/ || fas fa-images
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags

# 全站背景图
background: /img/bg.jpg

# 代码块 Mac 风格（红黄绿三点）
highlight_theme: mac

# 鼠标点击心形特效
click_heart:
  enable: true
  mobile: true

# 页面进入过渡动画
enter_transitions: true

# 加载动画（全屏转圈）
preloader:
  enable: true
  source: 1

# 首页副标题（打字与轮换由 beautify.js 接管，此处仅提供占位文字）
subtitle:
  enable: true
  effect: false
  source: false
  sub:
    - 但愿人长久

# 背景固定彩带特效
canvas_ribbon:
  enable: true
  size: 150
  alpha: 0.4
  zIndex: -1
  click_to_change: false
  mobile: false

# 侧栏
aside:
  card_author:
    enable: false
  card_announcement:
    enable: true
    content: HELLO WORLD

# 自定义样式注入
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  bottom:
    - <script src="/js/beautify.js"></script>

# 社交链接（后续可在此追加）
social:

# 头像
avatar:
  img: /img/avatar.png

# 页脚
footer:
  owner:
    enable: true
    since: 2026
    custom_text: '其实我在想 <span id="foot-heart">❤</span>'

# 文章页显示更新时间
post_meta:
  updated:
    display: true
